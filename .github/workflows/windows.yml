name: windows

# The plugin's settings dialog and menu action are Qt, and OBS on Windows is an
# MSVC build shipping its own MSVC Qt. A MinGW-built Qt in the same process as
# OBS's is two C++ ABIs sharing Qt types, so this build must be MSVC -- which
# means it runs here rather than on the Linux dev box.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      OBS_VERSION: 32.2.2
      # OBS 32.2.2 was released 2026-08-14; its dependencies are the set
      # published before that date. The Qt here must match OBS's own, or the
      # plugin links against a Qt the host process does not have.
      OBS_DEPS_VERSION: 2026-07-15

    steps:
      - uses: actions/checkout@v4

      - name: Fetch OBS source headers
        shell: pwsh
        run: |
          curl.exe -sSL -o obs-src.tar.gz "https://github.com/obsproject/obs-studio/archive/refs/tags/$env:OBS_VERSION.tar.gz"
          tar -xzf obs-src.tar.gz
          Move-Item "obs-studio-$env:OBS_VERSION" obs-studio
          Test-Path obs-studio/libobs/obs-module.h | Out-Null

      - name: Fetch OBS dependencies (Qt 6)
        shell: pwsh
        run: |
          curl.exe -sSL -o deps-qt6.zip "https://github.com/obsproject/obs-deps/releases/download/$env:OBS_DEPS_VERSION/windows-deps-qt6-$env:OBS_DEPS_VERSION-x64.zip"
          Expand-Archive deps-qt6.zip -DestinationPath deps
          # Layout varies by release, so locate the CMake config rather than
          # assuming a path.
          $qt = Get-ChildItem -Path deps -Recurse -Directory -Filter Qt6 |
                 Where-Object { $_.FullName -like '*\lib\cmake\Qt6' } |
                 Select-Object -First 1
          if (-not $qt) { Get-ChildItem deps | Out-String | Write-Host; throw 'Qt6 CMake config not found in obs-deps' }
          $prefix = Split-Path (Split-Path (Split-Path $qt.FullName))
          "QT_PREFIX=$prefix" | Out-File -Append $env:GITHUB_ENV

      - name: Fetch OBS release binaries
        shell: pwsh
        run: |
          curl.exe -sSL -o obs-release.zip "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip"
          Expand-Archive obs-release.zip -DestinationPath obs-release
          Get-ChildItem obs-release/bin/64bit/obs*.dll | Select-Object Name

      # dumpbin and lib live under the MSVC toolset directory, not on the
      # runner's PATH. Without this the export step fails with the tool
      # missing rather than with anything about the DLL.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The OBS release ships DLLs, not .lib files. Read the export table
      # straight from the PE headers -- that part is testable off Windows, and
      # leaves only lib.exe as something the runner has to provide.
      - name: Generate module definition files
        shell: python
        run: |
          import subprocess, sys
          for name in ('obs', 'obs-frontend-api'):
              subprocess.run(
                  [sys.executable, 'ci/windows/gen_def.py',
                   f'obs-release/bin/64bit/{name}.dll', f'{name}.def',
                   '--min-exports', '50'],
                  check=True,
              )

      - name: Generate import libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "::warning::resolving lib.exe"
          try {
            $libexe = ''
            $found = Get-Command lib.exe -ErrorAction SilentlyContinue
            if ($found) { $libexe = $found.Source }
            if (-not $libexe) {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
              Write-Host "::warning::vswhere present: $(Test-Path $vswhere)"
              $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              $toolset = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
              $libexe = Join-Path (Join-Path $toolset.FullName 'bin\Hostx64\x64') 'lib.exe'
            }
            Write-Host "::warning::lib.exe='$libexe' present: $(Test-Path $libexe)"
            if (-not (Test-Path $libexe)) { throw "lib.exe not found at '$libexe'" }

            New-Item -ItemType Directory -Force obs-lib | Out-Null
            foreach ($name in @('obs', 'obs-frontend-api')) {
              & $libexe /nologo /def:"$name.def" /machine:x64 /out:"obs-lib/$name.lib"
              if ($LASTEXITCODE -ne 0) { throw "lib failed for $name (exit $LASTEXITCODE)" }
              if (-not (Test-Path "obs-lib/$name.lib")) { throw "obs-lib/$name.lib was not produced" }
            }
            Write-Host "::warning::import libraries built"
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }

      - name: Configure
        shell: pwsh
        run: |
          $out = cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DOBS_SOURCE_DIR="$PWD/obs-studio" `
            -DOBS_LIB_DIR="$PWD/obs-lib" `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) {
            $tail = ($out | Select-Object -Last 12) -join ' | '
            Write-Host "::error::configure failed ($code): $tail"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Check the module's entry points
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'ci/windows')
          from gen_def import exported_names
          names = set(exported_names('build/Release/open-broadcast-raw-output.dll'))
          missing = {'obs_module_load', 'obs_module_unload'} - names
          if missing:
              raise SystemExit(f'entry points missing from the DLL: {sorted(missing)}')
          print(f'{len(names)} exports, both entry points present')

      - name: Package
        shell: pwsh
        run: |
          # The layout OBS scans under %ProgramData%\obs-studio\plugins.
          New-Item -ItemType Directory -Force package/obs-plugins/64bit | Out-Null
          Copy-Item build/Release/open-broadcast-raw-output.dll package/obs-plugins/64bit/
          if (Test-Path data) { Copy-Item data -Destination package/ -Recurse }
          Compress-Archive -Path package/* -DestinationPath open-broadcast-raw-output-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: open-broadcast-raw-output-win64
          path: |
            open-broadcast-raw-output-win64.zip
            build/Release/open-broadcast-raw-output.dll
