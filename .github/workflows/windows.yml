name: windows

# Builds the plugin with MSVC on Windows, packages it, and -- on a v* tag --
# publishes the package as a GitHub Release.
#
# The plugin's settings dialog and menu action are Qt, and OBS on Windows is an
# MSVC build shipping its own MSVC Qt. A MinGW-built Qt in the same process as
# OBS's is two C++ ABIs sharing Qt types, so this build must be MSVC -- which
# means it runs here rather than on the Linux dev box.
#
# Every run uploads the packaged zip as a workflow artifact. A push of a v* tag
# additionally attaches that zip plus its SHA-256 to a release; branch and
# pull-request runs only build and test.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # The release step creates and populates a release, which is a write to the
  # repository's contents. Reads are all branch and pull-request runs need.
  contents: write

concurrency:
  # Branch builds supersede each other. A tag build never cancels a running
  # release publish, so a re-pushed tag cannot leave a half-populated release.
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: windows-latest
    env:
      OBS_VERSION: 32.2.2
      # OBS 32.2.2 was released 2026-08-14; its dependencies are the set
      # published before that date. The Qt here must match OBS's own, or the
      # plugin links against a Qt the host process does not have.
      OBS_DEPS_VERSION: 2026-07-15

    steps:
      - uses: actions/checkout@v4

      - name: Fetch OBS source headers
        shell: pwsh
        run: |
          curl.exe -sSL -o obs-src.tar.gz "https://github.com/obsproject/obs-studio/archive/refs/tags/$env:OBS_VERSION.tar.gz"
          tar -xzf obs-src.tar.gz
          Move-Item "obs-studio-$env:OBS_VERSION" obs-studio
          if (-not (Test-Path obs-studio/libobs/obs-module.h)) {
            throw 'obs-module.h missing after extracting the OBS source'
          }

      - name: Fetch OBS dependencies (Qt 6)
        shell: pwsh
        run: |
          curl.exe -sSL -o deps-qt6.zip "https://github.com/obsproject/obs-deps/releases/download/$env:OBS_DEPS_VERSION/windows-deps-qt6-$env:OBS_DEPS_VERSION-x64.zip"
          Expand-Archive deps-qt6.zip -DestinationPath deps
          # Layout varies by release, so locate the CMake config rather than
          # assuming a path.
          $qt = Get-ChildItem -Path deps -Recurse -Directory -Filter Qt6 |
                 Where-Object { $_.FullName -like '*\lib\cmake\Qt6' } |
                 Select-Object -First 1
          if (-not $qt) { Get-ChildItem deps | Out-String | Write-Host; throw 'Qt6 CMake config not found in obs-deps' }
          $prefix = Split-Path (Split-Path (Split-Path $qt.FullName))
          "QT_PREFIX=$prefix" | Out-File -Append $env:GITHUB_ENV

      - name: Fetch OBS release binaries
        shell: pwsh
        run: |
          curl.exe -sSL -o obs-release.zip "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip"
          Expand-Archive obs-release.zip -DestinationPath obs-release
          Get-ChildItem obs-release/bin/64bit/obs*.dll | Select-Object Name

      # dumpbin and lib live under the MSVC toolset directory, not on the
      # runner's PATH. Without this the export step fails with the tool
      # missing rather than with anything about the DLL.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The OBS release ships DLLs, not .lib files. Read the export table
      # straight from the PE headers -- that part is testable off Windows, and
      # leaves only lib.exe as something the runner has to provide.
      - name: Generate module definition files
        shell: python
        run: |
          import subprocess, sys
          for name in ('obs', 'obs-frontend-api'):
              subprocess.run(
                  [sys.executable, 'ci/windows/gen_def.py',
                   f'obs-release/bin/64bit/{name}.dll', f'{name}.def',
                   '--min-exports', '50'],
                  check=True,
              )

      - name: Generate import libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "::warning::resolving lib.exe"
          try {
            $libexe = ''
            $found = Get-Command lib.exe -ErrorAction SilentlyContinue
            if ($found) { $libexe = $found.Source }
            if (-not $libexe) {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
              Write-Host "::warning::vswhere present: $(Test-Path $vswhere)"
              $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
              $toolset = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
              $libexe = Join-Path (Join-Path $toolset.FullName 'bin\Hostx64\x64') 'lib.exe'
            }
            Write-Host "::warning::lib.exe='$libexe' present: $(Test-Path $libexe)"
            if (-not (Test-Path $libexe)) { throw "lib.exe not found at '$libexe'" }

            New-Item -ItemType Directory -Force obs-lib | Out-Null
            foreach ($name in @('obs', 'obs-frontend-api')) {
              & $libexe /nologo /def:"$name.def" /machine:x64 /out:"obs-lib/$name.lib"
              if ($LASTEXITCODE -ne 0) { throw "lib failed for $name (exit $LASTEXITCODE)" }
              if (-not (Test-Path "obs-lib/$name.lib")) { throw "obs-lib/$name.lib was not produced" }
            }
            Write-Host "::warning::import libraries built"
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            exit 1
          }

      - name: Configure
        shell: pwsh
        run: |
          # Ninja against the MSVC environment rather than the "Visual Studio
          # 17 2022" generator: the runner image has no VS instance for CMake to
          # find, but msvc-dev-cmd has already put cl.exe on PATH.
          $out = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DOBS_SOURCE_DIR="$PWD/obs-studio" `
            -DOBS_LIB_DIR="$PWD/obs-lib" `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) {
            $tail = ($out | Select-Object -Last 12) -join ' | '
            Write-Host "::error::configure failed ($code): $tail"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          $out = cmake --build build 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) {
            $tail = ($out | Select-Object -Last 15) -join ' | '
            Write-Host "::error::build failed ($code): $tail"
            exit 1
          }

      - name: Check the module's entry points
        shell: python
        run: |
          import sys
          sys.path.insert(0, 'ci/windows')
          from gen_def import exported_names
          names = set(exported_names('build/open-broadcast-raw-output.dll'))
          missing = {'obs_module_load', 'obs_module_unload'} - names
          if missing:
              raise SystemExit(f'entry points missing from the DLL: {sorted(missing)}')
          print(f'{len(names)} exports, both entry points present')

      # Assembled from the CMake install rules rather than by copying files, so
      # the zip is whatever `install` declares: the DLL at obs-plugins/64bit and,
      # when the repo has one, the data tree at data/. That is the tree OBS scans
      # under %ProgramData%\obs-studio\plugins.
      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'package'
          $out = cmake --install build --prefix $package 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::cmake --install failed'; exit 1 }

          $dll = Join-Path $package 'obs-plugins/64bit/open-broadcast-raw-output.dll'
          if (-not (Test-Path $dll)) { throw "install did not place the DLL at $dll" }
          if (Test-Path (Join-Path $package 'data')) {
            Write-Host '::notice::data/ included from the install rules'
          }

          # A tag names the download after itself; anything else is a snapshot.
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'snapshot' }
          $zip = "open-broadcast-raw-output-$ver-win64.zip"
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zip

          # The hash ships beside the zip so a download can be checked against
          # the release without trusting the transfer.
          $sha = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          "$sha  $zip" | Out-File -Encoding ascii -NoNewline "$zip.sha256"

          $size = (Get-Item $zip).Length
          $entries = (Get-ChildItem -Path $package -Recurse -File | ForEach-Object {
            $_.FullName.Substring($package.Length + 1) -replace '\\', '/'
          }) -join ', '
          Write-Host "::notice::$zip ($size bytes) sha256 $sha; entries: $entries"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=$zip"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: open-broadcast-raw-output-win64
          path: |
            open-broadcast-raw-output-*-win64.zip
            open-broadcast-raw-output-*-win64.zip.sha256
            build/open-broadcast-raw-output.dll

      # Releases exist for tags only: a branch run publishes nothing, so the
      # artifact from the step above is the whole downloadable output there.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

